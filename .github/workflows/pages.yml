# Publishes the website to GitHub Pages (https://kinetixfsl.app) from main.
# Only the site files are uploaded: README.md, QA_REPORT.md, checks.mjs, serve.mjs, package.json,
# firebase.json and the other repository files are NOT published. Needs Settings > Pages > Source = "GitHub Actions".
name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the pages
        run: node checks.mjs
      - name: Collect the site files only
        run: |
          mkdir _site
          cp index.html privacy.html terms.html 404.html styles.css script.js theme.js release.js app-update.json robots.txt sitemap.xml CNAME .nojekyll _site/
          cp -r assets _site/assets
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
